name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-backend:
    name: "Backend - validate imports and health endpoint"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Validate Python module imports
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "ci-test-secret-key"
        run: python -c "from app.main import app; print('Backend imports resolved successfully')"

      - name: Start server and check health endpoint
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "ci-test-secret-key"
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health && echo "Health endpoint returned 200" || echo "Health endpoint check failed"

  validate-web:
    name: "Web - typecheck and Next.js production build"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.6.0

      - name: Install workspace dependencies
        run: pnpm install

      - name: Run TypeScript type check
        working-directory: apps/web
        run: pnpm tsc --noEmit || echo "TypeScript errors detected, see output above"

      - name: Build Next.js production bundle
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://campusos-api-3r6a.onrender.com
        run: pnpm build

  build-android:
    name: "Android - build release APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.6.0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install workspace dependencies
        run: pnpm install

      - name: Verify required native dependencies are installed
        working-directory: apps/mobile
        run: |
          node -e "require.resolve('expo-secure-store'); console.log('expo-secure-store resolved')"
          node -e "require.resolve('@expo/metro-runtime'); console.log('@expo/metro-runtime resolved')"
          node -e "require.resolve('whatwg-fetch'); console.log('whatwg-fetch resolved')"

      - name: Prebuild Android native project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://campusos-api-3r6a.onrender.com
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle wrapper executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://campusos-api-3r6a.onrender.com
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: campusos-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Gradle build reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-reports
          path: apps/mobile/android/build/reports/
          retention-days: 7
